name: Sync barrly Formula with Upstream Releases

# scripts/release.sh in arastu/barrly updates this formula directly; this workflow is the
# fallback (weekly, manual, or repository_dispatch) and commits straight to main.
on:
  schedule:
    - cron: "23 0 * * 1"
  workflow_dispatch:
  repository_dispatch:
    types: [barrly-release]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update formula to the latest release
        id: update
        shell: bash
        run: |
          set -euo pipefail
          formula="Formula/barrly.rb"
          owner_repo="arastu/barrly"
          latest_tag="${{ github.event.client_payload.tag || '' }}"
          if [[ -z "${latest_tag}" ]]; then
            latest_tag="$(curl -fsSL "https://api.github.com/repos/${owner_repo}/releases/latest" | jq -r '.tag_name')"
          fi
          [[ -n "${latest_tag}" && "${latest_tag}" != "null" ]] || { echo "no release"; exit 1; }
          current_tag="$(sed -n 's/^[[:space:]]*tag:[[:space:]]*"\(.*\)",$/\1/p' "${formula}" | head -n1)"
          if [[ "${current_tag}" == "${latest_tag}" ]]; then echo "updated=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          sha="$(git ls-remote "https://github.com/${owner_repo}.git" "refs/tags/${latest_tag}^{}" | awk '{print $1}' | head -n1)"
          [[ -n "${sha}" ]] || sha="$(git ls-remote "https://github.com/${owner_repo}.git" "refs/tags/${latest_tag}" | awk '{print $1}' | head -n1)"
          perl -0777 -i -pe 's/(tag:\s+")[^"]+(",\n\s+revision:\s+")[0-9a-f]{40}(")/${1}'"${latest_tag}"'${2}'"${sha}"'${3}/s' "${formula}"
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "tag=${latest_tag}" >> "$GITHUB_OUTPUT"

      - name: Commit
        if: steps.update.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "barrly: bump to ${{ steps.update.outputs.tag }}"
          git push
